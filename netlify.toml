[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# API yolları SPA yakalayıcısından ÖNCE gelmeli; kurallar yukarıdan aşağı
# değerlendirildiği için sıra önemli, aksi hâlde /api/* index.html'e düşer.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

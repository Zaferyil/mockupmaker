<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>MockupMaker</title>
    <meta name="description" content="POD mockups for Etsy, Amazon & Shopify" />

    <!-- Installable web app. The manifest plus a service worker with a fetch
         handler is what lets a browser offer "Install". -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#7B61FF" />
    <!-- iOS ignores the manifest and reads these instead. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="MockUP Maker" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

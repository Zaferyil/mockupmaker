<!doctype html>
<meta charset="utf-8" />
<title>placement harness</title>
<body>
<script type="module">
import { segmentGarment } from "/src/placement/garmentMask.js";
import { computeChestArea } from "/src/placement/chestArea.js";
import { solvePlacement } from "/src/placement/solve.js";
import { analyzeArtwork, canvasRectForInk } from "/src/placement/artwork.js";
import { validatePlacement, enforce } from "/src/placement/validate.js";
import { deriveHeight } from "/src/placement/contract.js";

// ---- synthetic mockup generator -------------------------------------
// Draws a t-shirt on a contrasting background. Parameters let us vary the
// things that were breaking placement in production: colour, scale, position,
// tilt and framing.
function makeShirt({ w = 900, h = 1100, shirtColor = "#c0397a", cx = 0.5, cy = 0.45,
                     scale = 1, tilt = 0, bg = "#efe7dc", skin = "#d8a882" } = {}) {
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  const g = c.getContext("2d");
  g.fillStyle = bg; g.fillRect(0, 0, w, h);

  const CX = w * cx, CY = h * cy;
  const bodyW = w * 0.44 * scale, bodyH = h * 0.5 * scale;

  g.save();
  g.translate(CX, CY);
  g.rotate((tilt * Math.PI) / 180);

  // sleeves
  g.fillStyle = shirtColor;
  g.beginPath();
  g.moveTo(-bodyW / 2, -bodyH / 2);
  g.lineTo(-bodyW * 0.92, -bodyH * 0.28);
  g.lineTo(-bodyW * 0.72, -bodyH * 0.05);
  g.lineTo(-bodyW / 2, -bodyH * 0.18);
  g.closePath(); g.fill();
  g.beginPath();
  g.moveTo(bodyW / 2, -bodyH / 2);
  g.lineTo(bodyW * 0.92, -bodyH * 0.28);
  g.lineTo(bodyW * 0.72, -bodyH * 0.05);
  g.lineTo(bodyW / 2, -bodyH * 0.18);
  g.closePath(); g.fill();

  // body
  g.fillRect(-bodyW / 2, -bodyH / 2, bodyW, bodyH);

  // neck opening (skin shows through) — the collar notch the detector looks for
  g.fillStyle = skin;
  g.beginPath();
  g.ellipse(0, -bodyH / 2 + bodyH * 0.02, bodyW * 0.17, bodyH * 0.055, 0, 0, Math.PI * 2);
  g.fill();

  // soft fold shading: varies luminance a lot, chromaticity barely — exactly
  // what the segmenter is supposed to grow straight through.
  g.globalAlpha = 0.16;
  g.fillStyle = "#000";
  for (let i = 0; i < 7; i++) {
    g.beginPath();
    g.ellipse(-bodyW * 0.3 + i * bodyW * 0.1, bodyH * 0.1, bodyW * 0.035, bodyH * 0.34, 0.15, 0, Math.PI * 2);
    g.fill();
  }
  g.globalAlpha = 1;
  g.restore();
  return c.toDataURL("image/png");
}

// ---- synthetic artwork ----------------------------------------------
function makeArtwork({ w, h, pad = 0 }) {
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  const g = c.getContext("2d");
  g.clearRect(0, 0, w, h);
  const px = w * pad, py = h * pad;
  g.fillStyle = "#1b2c6b";
  g.fillRect(px, py, w - px * 2, h - py * 2);
  g.fillStyle = "#ffd23f";
  g.fillRect(px + (w - px * 2) * 0.2, py + (h - py * 2) * 0.3, (w - px * 2) * 0.6, (h - py * 2) * 0.4);
  return c.toDataURL("image/png");
}

const load = (src) => new Promise((res, rej) => {
  const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src;
});

async function measure(shirtOpts, artSrc) {
  const img = await load(makeShirt(shirtOpts));
  const art = analyzeArtwork(await load(artSrc));
  const garment = segmentGarment(img, null);
  if (!garment) return { error: "segmentation failed" };
  const chest = computeChestArea(garment, art);
  if (!chest) return { error: "chest area failed" };
  const imageAspect = img.width / img.height;
  const placement = solvePlacement(chest, art, imageAspect, 100);
  const validation = validatePlacement(placement, chest, art, imageAspect);
  return { chest, placement, validation, art, imageAspect, maskConfidence: garment.confidence };
}

const results = {};
const square = makeArtwork({ w: 800, h: 800 });

// 1. determinism — identical input twice
{
  const a = await measure({}, square);
  const b = await measure({}, square);
  results.determinism = {
    a: a.placement, b: b.placement,
    identical: JSON.stringify(a.placement) === JSON.stringify(b.placement),
  };
}

// 2. colour invariance — same geometry, six very different shirt colours.
//    This is the "works on white, breaks on navy" complaint.
{
  const colors = ["#ffffff", "#111318", "#c0397a", "#2f4d7a", "#5c6b4a", "#8a4b2a"];
  const out = [];
  for (const shirtColor of colors) {
    const r = await measure({ shirtColor }, square);
    out.push(r.error ? { shirtColor, error: r.error } : {
      shirtColor,
      cx: +r.placement.centerX.toFixed(4),
      cy: +r.placement.centerY.toFixed(4),
      w: +r.placement.width.toFixed(4),
    });
  }
  const ok = out.filter((o) => !o.error);
  results.colorInvariance = {
    samples: out,
    cxSpread: ok.length ? Math.max(...ok.map(o=>o.cx)) - Math.min(...ok.map(o=>o.cx)) : null,
    cySpread: ok.length ? Math.max(...ok.map(o=>o.cy)) - Math.min(...ok.map(o=>o.cy)) : null,
    wSpread:  ok.length ? Math.max(...ok.map(o=>o.w))  - Math.min(...ok.map(o=>o.w))  : null,
  };
}

// 3. translation tracking — shirt moved right; placement must follow it
{
  const base = await measure({ cx: 0.5 }, square);
  const moved = await measure({ cx: 0.62 }, square);
  results.translation = {
    baseCx: +base.placement.centerX.toFixed(4),
    movedCx: +moved.placement.centerX.toFixed(4),
    delta: +(moved.placement.centerX - base.placement.centerX).toFixed(4),
    expected: 0.12,
  };
}

// 4. scale invariance — bigger shirt, print must scale with the garment
{
  const small = await measure({ scale: 1 }, square);
  const big = await measure({ scale: 1.3 }, square);
  results.scale = {
    smallW: +small.placement.width.toFixed(4),
    bigW: +big.placement.width.toFixed(4),
    ratio: +(big.placement.width / small.placement.width).toFixed(3),
    expected: 1.3,
  };
}

// 5. transparent padding — the same visible design with and without a 25%
//    transparent margin must render identical ink.
{
  const tight = makeArtwork({ w: 800, h: 800, pad: 0 });
  const padded = makeArtwork({ w: 800, h: 800, pad: 0.25 });
  const a = await measure({}, tight);
  const b = await measure({}, padded);

  const inkOf = (r) => {
    const W = 1000, H = 1000 / r.imageAspect;
    const h = deriveHeight(r.placement.width, r.art.visibleAspect, r.imageAspect);
    return { w: +(r.placement.width * W).toFixed(1), h: +(h * H).toFixed(1) };
  };
  const canvasOf = (r) => {
    const W = 1000, H = 1000 / r.imageAspect;
    const h = deriveHeight(r.placement.width, r.art.visibleAspect, r.imageAspect);
    const ink = { x: (r.placement.centerX - r.placement.width/2)*W, y: (r.placement.centerY - h/2)*H,
                  w: r.placement.width*W, h: h*H };
    const full = canvasRectForInk(r.art, ink);
    return { w: +full.w.toFixed(1), h: +full.h.toFixed(1) };
  };

  results.padding = {
    tightTrim: a.art.trim, paddedTrim: b.art.trim,
    tightPaddingRatio: +a.art.paddingRatio.toFixed(3),
    paddedPaddingRatio: +b.art.paddingRatio.toFixed(3),
    tightInk: inkOf(a), paddedInk: inkOf(b),
    tightDrawnCanvas: canvasOf(a), paddedDrawnCanvas: canvasOf(b),
  };
}

// 6. aspect preservation across very different artwork shapes
{
  const shapes = [
    { name: "square", w: 800, h: 800 },
    { name: "wide", w: 1600, h: 600 },
    { name: "tall", w: 600, h: 1600 },
  ];
  const out = [];
  for (const s of shapes) {
    const r = await measure({}, makeArtwork(s));
    const h = deriveHeight(r.placement.width, r.art.visibleAspect, r.imageAspect);
    const renderedAspect = (r.placement.width / h) * r.imageAspect;
    out.push({
      name: s.name,
      sourceAspect: +(s.w / s.h).toFixed(4),
      renderedAspect: +renderedAspect.toFixed(4),
      cx: +r.placement.centerX.toFixed(4),
      cy: +r.placement.centerY.toFixed(4),
      width: +r.placement.width.toFixed(4),
      valid: r.validation.ok,
      failures: r.validation.failures,
    });
  }
  results.aspect = out;
}

// 7. QC repair — a deliberately broken placement must come back legal
{
  const r = await measure({}, square);
  const broken = { ...r.placement, centerX: 0.95, width: 1.4 };
  const fixed = enforce(broken, r.chest, r.art, r.imageAspect);
  results.qc = {
    brokenValid: validatePlacement(broken, r.chest, r.art, r.imageAspect).ok,
    repairs: fixed.repairs,
    fixedValid: fixed.validation.ok,
    fixed: { cx: +fixed.placement.centerX.toFixed(4), w: +fixed.placement.width.toFixed(4) },
  };
}

// 8. tilt — a leaning model should produce a matching artwork rotation
{
  const straight = await measure({ tilt: 0 }, square);
  const leaning = await measure({ tilt: 8 }, square);
  results.tilt = {
    straight: +straight.placement.rotation.toFixed(2),
    leaning: +leaning.placement.rotation.toFixed(2),
    pose: leaning.chest.analysis.pose,
  };
}

// 9. fabric shading must not touch pixels the print does not cover.
//    A rotated print has a much larger axis-aligned bounding box than its own
//    area, so shading applied box-wide leaves a visible rectangular halo.
{
  const { renderMockup } = await import("/src/placement/compositor.js");
  const shirt = await load(makeShirt({ shirtColor: "#c0397a" }));
  const artImg = await load(square);
  const artA = analyzeArtwork(artImg);
  const placement = { centerX: 0.5, centerY: 0.42, width: 0.3, rotation: 30,
                      opacity: 100, perspective: null };

  const draw = (shading) => {
    const c = document.createElement("canvas");
    c.width = shirt.width; c.height = shirt.height;
    const ctx = c.getContext("2d", { willReadFrequently: true });
    renderMockup(ctx, shirt, artImg, artA, placement, { shading });
    return ctx.getImageData(0, 0, c.width, c.height).data;
  };

  const withShading = draw(true);
  const without = draw(false);

  // Corner of the rotated print's bounding box — inside the box, outside the
  // artwork. This is exactly where the halo appeared.
  const h = (0.3 / artA.visibleAspect) * (shirt.width / shirt.height);
  const probes = [
    [0.5 - 0.3 / 2 - 0.01, 0.42 - h / 2 - 0.01],
    [0.5 + 0.3 / 2 + 0.01, 0.42 - h / 2 - 0.01],
    [0.5 - 0.3 / 2 - 0.01, 0.42 + h / 2 + 0.01],
  ];
  let maxDiff = 0;
  for (const [fx, fy] of probes) {
    const px = Math.round(fx * shirt.width);
    const py = Math.round(fy * shirt.height);
    const i = (py * shirt.width + px) * 4;
    for (let k = 0; k < 3; k++) {
      maxDiff = Math.max(maxDiff, Math.abs(withShading[i + k] - without[i + k]));
    }
  }

  // And confirm shading really is being applied *on* the print.
  const ci = (Math.round(0.42 * shirt.height) * shirt.width + Math.round(0.5 * shirt.width)) * 4;
  const centerDiff = Math.abs(withShading[ci] - without[ci]) +
                     Math.abs(withShading[ci + 1] - without[ci + 1]) +
                     Math.abs(withShading[ci + 2] - without[ci + 2]);

  results.shadingHalo = { maxDiffOutside: maxDiff, diffOnPrint: centerDiff };
}

// 10. no anisotropic scaling anywhere in the export path.
//     A circle in a square canvas with asymmetric transparent padding becomes
//     a measurable ellipse under any non-uniform scale, so this catches
//     stretching that eyeballing a photo cannot settle.
{
  const { renderMockup } = await import("/src/placement/compositor.js");
  const { lockToChest } = await import("/src/placement/templateLock.js");
  const { makePlacement } = await import("/src/placement/contract.js");

  const ac = document.createElement("canvas");
  ac.width = 1024; ac.height = 1024;
  {
    const g = ac.getContext("2d");
    g.clearRect(0, 0, 1024, 1024);
    g.fillStyle = "#ff00ff";
    g.beginPath(); g.arc(500, 480, 360, 0, Math.PI * 2); g.fill();
  }
  const circleImg = await load(ac.toDataURL("image/png"));
  const circleArt = analyzeArtwork(circleImg);

  // Flat ground: nothing in a photograph can be mistaken for the probe colour.
  const bg = document.createElement("canvas");
  bg.width = 1254; bg.height = 1254;
  { const g = bg.getContext("2d"); g.fillStyle = "#2b3a55"; g.fillRect(0, 0, 1254, 1254); }
  const bgImg = await load(bg.toDataURL("image/png"));

  // Refit through a pinned lock, the path a second artwork actually takes.
  const lock = { kind: "pinned", centerX: 0.513, centerY: 0.547, width: 0.347,
                 height: 0, rotation: 0, perspective: null, confidence: 1 };
  const chest = lockToChest(lock);
  const placement = solvePlacement(chest, circleArt, 1, 100, "locked");

  const cv = document.createElement("canvas");
  cv.width = 1254; cv.height = 1254;
  const ctx = cv.getContext("2d", { willReadFrequently: true });
  renderMockup(ctx, bgImg, circleImg, circleArt, placement, { shading: false });

  const d = ctx.getImageData(0, 0, cv.width, cv.height).data;
  let minX = 1e9, maxX = -1, minY = 1e9, maxY = -1;
  for (let y = 0; y < cv.height; y++) for (let x = 0; x < cv.width; x++) {
    const i = (y * cv.width + x) * 4;
    if (d[i] > 200 && d[i + 1] < 60 && d[i + 2] > 200) {
      if (x < minX) minX = x; if (x > maxX) maxX = x;
      if (y < minY) minY = y; if (y > maxY) maxY = y;
    }
  }
  const rw = maxX - minX + 1, rh = maxY - minY + 1;
  results.distortion = {
    lockedWidth: lock.width,
    solvedWidth: +placement.width.toFixed(4),
    rendered: `${rw}x${rh}`,
    renderedAspect: +(rw / rh).toFixed(4),
  };

  // Same locked rectangle, four very differently shaped artworks. Each must
  // fit inside the box, touch it on exactly one axis, and keep its own
  // proportions — that is what stops the design's aspect ratio from deciding
  // how big the print comes out.
  const shapes = [
    { name: "square", w: 900, h: 900 },
    { name: "portrait", w: 600, h: 1100 },
    { name: "landscape", w: 1400, h: 700 },
    { name: "tall", w: 500, h: 1400 },
  ];
  const fits = [];
  for (const sh of shapes) {
    const a = analyzeArtwork(await load(makeArtwork(sh)));
    const pl = solvePlacement(chest, a, 1, 100, "locked");
    const hh = deriveHeight(pl.width, a.visibleAspect, 1);
    const renderedAspect = (pl.width / hh) * 1;
    fits.push({
      name: sh.name,
      w: +pl.width.toFixed(4),
      h: +hh.toFixed(4),
      withinW: pl.width <= chest.width * 1.001,
      withinH: hh <= chest.height * 1.001,
      touches: Math.abs(pl.width - chest.width) < 1e-4 || Math.abs(hh - chest.height) < 1e-4,
      aspectOk: Math.abs(renderedAspect - a.visibleAspect) / a.visibleAspect < 0.005,
    });
  }
  results.lockedFit = { box: { w: +chest.width.toFixed(4), h: +chest.height.toFixed(4) }, fits };
}

// 11. rendered ink must stay inside the placement box.
//     The renderer scales the whole PNG so the trim box lands on the placement
//     box, so any visible pixel excluded from the trim renders *outside* the
//     placement. This is what a tightened trim broke: scattered decoration
//     spilled past the garment. Bounding every visible pixel is the invariant.
{
  const { renderMockup } = await import("/src/placement/compositor.js");

  // Solid block plus decoration flung toward the canvas corners — the shape
  // that produced the overspill.
  const c = document.createElement("canvas");
  c.width = 1024; c.height = 1024;
  {
    const g = c.getContext("2d");
    g.clearRect(0, 0, 1024, 1024);
    g.fillStyle = "#1b2c6b";
    g.fillRect(262, 200, 500, 620);
    g.fillStyle = "rgba(220,120,180,0.85)";
    for (const [x, y] of [[60,80],[960,110],[80,940],[970,930],[40,512],[990,500]]) {
      g.beginPath(); g.arc(x, y, 22, 0, Math.PI*2); g.fill();
    }
  }
  const artImg = await load(c.toDataURL("image/png"));
  const artA = analyzeArtwork(artImg);

  const bg = document.createElement("canvas");
  bg.width = 1200; bg.height = 1200;
  { const g = bg.getContext("2d"); g.fillStyle = "#2b3a55"; g.fillRect(0,0,1200,1200); }
  const bgImg = await load(bg.toDataURL("image/png"));

  const placement = { centerX: 0.5, centerY: 0.45, width: 0.3, rotation: 0,
                      opacity: 100, perspective: null };

  const cv = document.createElement("canvas");
  cv.width = 1200; cv.height = 1200;
  const ctx = cv.getContext("2d", { willReadFrequently: true });
  renderMockup(ctx, bgImg, artImg, artA, placement, { shading: false });

  // Everything that is not the flat background counts as drawn ink.
  const d = ctx.getImageData(0, 0, 1200, 1200).data;
  let minX = 1e9, maxX = -1, minY = 1e9, maxY = -1;
  for (let y = 0; y < 1200; y++) for (let x = 0; x < 1200; x++) {
    const i = (y * 1200 + x) * 4;
    const isBg = Math.abs(d[i]-0x2b) < 6 && Math.abs(d[i+1]-0x3a) < 6 && Math.abs(d[i+2]-0x55) < 6;
    if (!isBg) { if (x<minX) minX=x; if (x>maxX) maxX=x; if (y<minY) minY=y; if (y>maxY) maxY=y; }
  }

  const h = deriveHeight(placement.width, artA.visibleAspect, 1);
  const box = {
    x0: (placement.centerX - placement.width/2) * 1200,
    x1: (placement.centerX + placement.width/2) * 1200,
    y0: (placement.centerY - h/2) * 1200,
    y1: (placement.centerY + h/2) * 1200,
  };

  results.overspill = {
    drawn: { minX, maxX, minY, maxY },
    box: { x0: Math.round(box.x0), x1: Math.round(box.x1),
           y0: Math.round(box.y0), y1: Math.round(box.y1) },
    // Positive = ink outside the placement box, in pixels.
    worst: Math.round(Math.max(box.x0 - minX, maxX - box.x1, box.y0 - minY, maxY - box.y1)),
  };
}

// 12. projective warp: a design rendered through a trapezoid must taper by the
//     same ratio as the quad. Canvas 2D has no perspective transform, so this
//     verifies the triangle-mesh homography actually reproduces one.
{
  const { renderMockup } = await import("/src/placement/compositor.js");

  const ac = document.createElement("canvas");
  ac.width = 600; ac.height = 600;
  { const g = ac.getContext("2d"); g.clearRect(0,0,600,600);
    g.fillStyle = "#ff00ff"; g.fillRect(0, 0, 600, 600); }
  const artImg = await load(ac.toDataURL("image/png"));
  const artA = analyzeArtwork(artImg);

  const bg = document.createElement("canvas");
  bg.width = 1000; bg.height = 1000;
  { const g = bg.getContext("2d"); g.fillStyle = "#203040"; g.fillRect(0,0,1000,1000); }
  const bgImg = await load(bg.toDataURL("image/png"));

  // Trapezoid: top edge 400px, bottom edge 200px — a 2:1 taper.
  const quad = [0.30, 0.30, 0.70, 0.30, 0.60, 0.70, 0.40, 0.70];
  const placement = { centerX: 0.5, centerY: 0.5, width: 0.4, rotation: 0,
                      opacity: 100, perspective: quad };

  const cv = document.createElement("canvas");
  cv.width = 1000; cv.height = 1000;
  const ctx = cv.getContext("2d", { willReadFrequently: true });
  renderMockup(ctx, bgImg, artImg, artA, placement, { shading: false });

  const d = ctx.getImageData(0, 0, 1000, 1000).data;
  const rowWidth = (y) => {
    let min = 1e9, max = -1;
    for (let x = 0; x < 1000; x++) {
      const i = (y * 1000 + x) * 4;
      if (d[i] > 200 && d[i+1] < 60 && d[i+2] > 200) { if (x < min) min = x; if (x > max) max = x; }
    }
    return max < 0 ? 0 : max - min + 1;
  };
  // Sample just inside the top and bottom edges.
  const topW = rowWidth(310);
  const botW = rowWidth(690);

  results.warp = {
    topWidth: topW,
    bottomWidth: botW,
    measuredTaper: botW > 0 ? +(topW / botW).toFixed(3) : null,
    expectedTaper: 2.0,
  };
}

// 13. preview and export must agree.
//     The preview renders at a working resolution and the export at the
//     mockup's full size. Both go through renderMockup, so the ink must land
//     at the same *normalized* position in each — that is the property that
//     broke repeatedly while the preview was drawn with CSS.
{
  const { renderMockup } = await import("/src/placement/compositor.js");

  const ac = document.createElement("canvas");
  ac.width = 900; ac.height = 700;
  { const g = ac.getContext("2d");
    g.clearRect(0,0,900,700);
    // Asymmetric padding: ink occupies an off-centre patch of the canvas.
    g.fillStyle = "#ff00ff"; g.fillRect(120, 90, 500, 400); }
  const artImg = await load(ac.toDataURL("image/png"));
  const artA = analyzeArtwork(artImg);

  const bg = document.createElement("canvas");
  bg.width = 1200; bg.height = 1500;
  { const g = bg.getContext("2d"); g.fillStyle = "#334455"; g.fillRect(0,0,1200,1500); }
  const bgImg = await load(bg.toDataURL("image/png"));

  const placement = { centerX: 0.46, centerY: 0.38, width: 0.34, rotation: 0,
                      opacity: 100, perspective: null };

  const inkAt = (cw, ch) => {
    const c = document.createElement("canvas");
    c.width = cw; c.height = ch;
    const ctx = c.getContext("2d", { willReadFrequently: true });
    renderMockup(ctx, bgImg, artImg, artA, placement, { shading: false });
    const d = ctx.getImageData(0, 0, cw, ch).data;
    let minX = 1e9, maxX = -1, minY = 1e9, maxY = -1;
    for (let y = 0; y < ch; y++) for (let x = 0; x < cw; x++) {
      const i = (y * cw + x) * 4;
      if (d[i] > 200 && d[i+1] < 60 && d[i+2] > 200) {
        if (x < minX) minX = x; if (x > maxX) maxX = x;
        if (y < minY) minY = y; if (y > maxY) maxY = y;
      }
    }
    if (maxX < 0) return null;
    return {
      cx: +(((minX + maxX) / 2) / cw).toFixed(4),
      cy: +(((minY + maxY) / 2) / ch).toFixed(4),
      w: +((maxX - minX + 1) / cw).toFixed(4),
    };
  };

  // Preview resolution vs full export resolution.
  const preview = inkAt(800, 1000);
  const exported = inkAt(1200, 1500);
  results.previewMatch = { preview, exported };
}

window.__RESULTS__ = results;
document.title = "done";
</script>
</body>
